# The cluster-wide cms-labs-terminal controller turns this declaration into
# the namespace-local broker, RBAC, NetworkPolicy and one Service per target.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-labs-terminal-config
  namespace: $NAME
  labels:
    cms-labs.io/terminal-config: "true"
data:
  config.yaml: |-
    targets:
      - name: r1
        label: Router r1
        mode: exec
        command: [/bin/ash, -l]
      - name: s1
        label: Switch s1
        mode: exec
        command: [/bin/ash, -l]
