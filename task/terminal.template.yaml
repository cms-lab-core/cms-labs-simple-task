# The terminal is a regular lab resource. Clabgate only validates and applies this manifest; it does
# not know the terminal image, configuration schema, targets or commands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-labs-terminal
  namespace: $NAME
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cms-labs-terminal
  namespace: $NAME
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cms-labs-terminal
  namespace: $NAME
subjects:
  - kind: ServiceAccount
    name: cms-labs-terminal
    namespace: $NAME
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cms-labs-terminal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-labs-terminal
  namespace: $NAME
data:
  config.yaml: |-
    server:
      address: 0.0.0.0
      title: Simple task
      authHeader: X-CMS-Identity
      maxClients: 4
    broker:
      address: 127.0.0.1:17680
      lease: 30m
      reapInterval: 1m
      scrollbackBytes: 1048576
      history: 3
    access:
      namespaces: [$NAME]
      nodeLabel: c9s.run/topologyNode
      ownerLabel: c9s.run/topologyOwner
      owner: $NAME
    session:
      mode: exec
      command: [/bin/sh]
    targets:
      - name: r1
        label: Router r1
        port: 7681
        mode: exec
        command: [/bin/ash, -l]
      - name: s1
        label: Switch s1
        port: 7682
        mode: exec
        command: [/bin/ash, -l]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-labs-terminal
  namespace: $NAME
  labels:
    app.kubernetes.io/name: cms-labs-terminal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cms-labs-terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cms-labs-terminal
    spec:
      serviceAccountName: cms-labs-terminal
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terminal
          image: ghcr.io/cms-lab-core/cms-labs-terminal:latest
          imagePullPolicy: IfNotPresent
          args: [serve]
          env:
            - name: CMS_LABS_TERMINAL_CONFIG
              value: /etc/cms-labs-terminal/config.yaml
          ports:
            - name: terminal-r1
              containerPort: 7681
            - name: terminal-s1
              containerPort: 7682
          volumeMounts:
            - name: config
              mountPath: /etc/cms-labs-terminal
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: terminal-r1
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: terminal-r1
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: cms-labs-terminal
---
# Clabgate discovers terminal endpoints through the stable Service port contract: ttyd:7681.
apiVersion: v1
kind: Service
metadata:
  name: r1-terminal
  namespace: $NAME
  annotations:
    cms-labs.io/terminal-target: r1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cms-labs-terminal
  ports:
    - name: ttyd
      port: 7681
      targetPort: terminal-r1
---
apiVersion: v1
kind: Service
metadata:
  name: s1-terminal
  namespace: $NAME
  annotations:
    cms-labs.io/terminal-target: s1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cms-labs-terminal
  ports:
    - name: ttyd
      port: 7681
      targetPort: terminal-s1
---
# Only the CMS workspace proxy may open a browser-facing terminal connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cms-labs-terminal
  namespace: $NAME
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cms-labs-terminal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: $WORKSPACE_PROXY_NAMESPACE
      ports:
        - protocol: TCP
          port: 7681
        - protocol: TCP
          port: 7682
