images:
  mysql:
    repository: mysql
    tag: latest
    pullPolicy: Always
  backend:
    repository: ghcr.io/cms-lab-core/cms-labs-api/backend
    tag: latest
    pullPolicy: Always
  clabgate:
    repository: ghcr.io/cms-lab-core/cms-labs-api/clabgate
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/cms-lab-core/cms-labs-api/frontend
    tag: latest
    pullPolicy: Always

clabgate:
  replicas: 2
  taskRepository: https://github.com/cms-lab-core/cms-labs-simple-task
  taskBranch: main
  jupyterImage: ghcr.io/cms-lab-core/cms-labs-jupyter:latest
  checkerImage: ghcr.io/cms-lab-core/cms-labs-checker:latest
  workspaceAuthSecret: cms-labs-demo-cookie-secret-change-before-production
  workspaceGrantTTLSeconds: 300
  reconcileIntervalSeconds: 3

frontend:
  nodePort: 30080

database:
  name: db
  user: root
  password: pnetlab

jwt:
  secretName: cms-demo-jwt
  privateKey: ""
  publicKey: ""

resources:
  mysql:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  backend:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}
  clabgate:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  frontend:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 250m, memory: 192Mi}
