{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.jwt.secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  private.pem: {{ required "existing JWT secret has no private.pem" (index $existing.data "private.pem") | quote }}
  public.pem: {{ required "existing JWT secret has no public.pem" (index $existing.data "public.pem") | quote }}
{{- else }}
stringData:
  private.pem: |
    {{- required "jwt.privateKey is required for the first installation" .Values.jwt.privateKey | nindent 4 }}
  public.pem: |
    {{- required "jwt.publicKey is required for the first installation" .Values.jwt.publicKey | nindent 4 }}
{{- end }}
