apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ include "cms-labs-dev.image" .Values.images.frontend | quote }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: SYSTEM_DNS, value: "10.96.0.10"}
            - {name: CMS_CORE_SERVICE, value: {{ printf "http://backend.%s.svc.cluster.local:5000" .Release.Namespace | quote }}}
            - {name: CLABGATE_SERVICE, value: {{ printf "http://clabgate.%s.svc.cluster.local:80" .Release.Namespace | quote }}}
            - {name: SSL_CONF, value: ""}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.frontend.nodePort }}
