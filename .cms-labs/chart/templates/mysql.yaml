apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "mysql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: {{ include "cms-labs-dev.image" .Values.images.mysql | quote }}
          imagePullPolicy: {{ .Values.images.mysql.pullPolicy }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - {name: MYSQL_DATABASE, value: {{ .Values.database.name | quote }}}
            - {name: MYSQL_ROOT_PASSWORD, value: {{ .Values.database.password | quote }}}
          ports: [{name: mysql, containerPort: 3306}]
          readinessProbe:
            exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1", {{ printf "-p%s" .Values.database.password | quote }}]}
            initialDelaySeconds: 10
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources.mysql | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "mysql") | nindent 4 }}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
