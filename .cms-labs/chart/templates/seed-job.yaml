apiVersion: batch/v1
kind: Job
metadata:
  name: cms-demo-seed-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: cms-demo-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cms-demo-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: {{ include "cms-labs-dev.image" .Values.images.mysql | quote }}
          imagePullPolicy: {{ .Values.images.mysql.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - until mysqladmin ping --silent -h mysql -u "$MYSQL_USER" -p"$MYSQL_PASSWORD"; do sleep 2; done
          env:
            - {name: MYSQL_USER, value: {{ .Values.database.user | quote }}}
            - {name: MYSQL_PASSWORD, value: {{ .Values.database.password | quote }}}
      containers:
        - name: seed
          image: {{ include "cms-labs-dev.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          args: ["--demo"]
          envFrom:
            - configMapRef: {name: cms-demo-backend-env}
          env:
            - name: JWT_SECRET_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: private.pem}}
            - name: JWT_SECRET_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: public.pem}}
            - name: JWT_REFRESH_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: private.pem}}
            - name: JWT_REFRESH_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: public.pem}}
