apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: {{ include "cms-labs-dev.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          envFrom:
            - configMapRef: {name: cms-demo-backend-env}
          env:
            - name: JWT_SECRET_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: private.pem}}
            - name: JWT_SECRET_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: public.pem}}
            - name: JWT_REFRESH_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: private.pem}}
            - name: JWT_REFRESH_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: {{ .Values.jwt.secretName }}, key: public.pem}}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cms-labs-dev.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports: [{name: http, port: 5000, targetPort: http}]
