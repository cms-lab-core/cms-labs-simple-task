apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-demo-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cms-labs-dev.labels" . | nindent 4 }}
data:
  STAGE_STATUS: prod
  DEBUG: "false"
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "5000"
  SERVER_READ_TIMEOUT: "60"
  DB_TYPE: mysql
  DB_HOST: {{ printf "mysql.%s.svc.cluster.local" .Release.Namespace }}
  DB_PORT: "3306"
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_SSL_MODE: disable
  DB_MAX_CONNECTIONS: "20"
  DB_MAX_IDLE_CONNECTIONS: "5"
  DB_MAX_LIFETIME_CONNECTIONS: "30"
  DB_TABLE_PREFIX: core_
  LAB_CATALOG_ENABLED: "true"
  JWT_SECRET_KEY_EXPIRE_MINUTES_COUNT: "60"
  JWT_REFRESH_KEY_EXPIRE_HOURS_COUNT: "24"
  VAULT_ADDR: ""
  VAULT_TOKEN: ""
