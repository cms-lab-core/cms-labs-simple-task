apiVersion: v1
kind: Namespace
metadata:
  name: cms-labs-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clabgate
  namespace: cms-labs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clabgate-demo
rules:
  - apiGroups: ["clabernetes.containerlab.dev"]
    resources: ["topologies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/exec", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clabgate-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clabgate-demo
subjects:
  - kind: ServiceAccount
    name: clabgate
    namespace: cms-labs-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: cms-labs-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - {name: MYSQL_DATABASE, value: db}
            - {name: MYSQL_ROOT_PASSWORD, value: pnetlab}
          ports: [{name: mysql, containerPort: 3306}]
          readinessProbe:
            exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-ppnetlab"]}
            initialDelaySeconds: 10
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cms-labs-system
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-demo-backend-env
  namespace: cms-labs-system
data:
  STAGE_STATUS: prod
  DEBUG: "false"
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "5000"
  SERVER_READ_TIMEOUT: "60"
  DB_TYPE: mysql
  DB_HOST: mysql.cms-labs-system.svc.cluster.local
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: pnetlab
  DB_NAME: db
  DB_SSL_MODE: disable
  DB_MAX_CONNECTIONS: "20"
  DB_MAX_IDLE_CONNECTIONS: "5"
  DB_MAX_LIFETIME_CONNECTIONS: "30"
  DB_TABLE_PREFIX: core_
  JWT_SECRET_KEY_EXPIRE_MINUTES_COUNT: "60"
  JWT_REFRESH_KEY_EXPIRE_HOURS_COUNT: "24"
  VAULT_ADDR: ""
  VAULT_TOKEN: ""
