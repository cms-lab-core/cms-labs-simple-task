apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cms-labs-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/maintainer64/cms-labs-api/backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: cms-demo-backend-env}
          env:
            - name: JWT_SECRET_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: cms-demo-jwt, key: private.pem}}
            - name: JWT_SECRET_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: cms-demo-jwt, key: public.pem}}
            - name: JWT_REFRESH_KEY_PRIVATE
              valueFrom: {secretKeyRef: {name: cms-demo-jwt, key: private.pem}}
            - name: JWT_REFRESH_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: cms-demo-jwt, key: public.pem}}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cms-labs-system
spec:
  selector: {app: backend}
  ports: [{name: http, port: 5000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clabgate
  namespace: cms-labs-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: clabgate}
  template:
    metadata:
      labels: {app: clabgate}
    spec:
      serviceAccountName: clabgate
      containers:
        - name: clabgate
          image: ghcr.io/maintainer64/cms-labs-api/clabgate:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: STAGE_STATUS, value: prod}
            - {name: DEBUG, value: "false"}
            - {name: SERVER_HOST, value: 0.0.0.0}
            - {name: SERVER_PORT, value: "8080"}
            - {name: SERVER_READ_TIMEOUT, value: "60"}
            - {name: CMS_URL, value: "http://backend.cms-labs-system.svc.cluster.local:5000"}
            - {name: CMS_LOGIN, value: demo-kubernetes}
            - {name: CMS_PASSWORD, value: demo-secret}
            - {name: CMS_TASK_URL, value: "https://github.com/maintainer64/cms-labs-simple-task"}
            - {name: CMS_TASK_BRANCH, value: main}
            - {name: JUPYTER_IMAGE, value: "ghcr.io/maintainer64/cms-labs-jupyter:latest"}
            - {name: JUPYTER_STORAGE_SIZE, value: 1Gi}
            - {name: WORKSPACE_AUTH_SECRET, value: cms-labs-demo-cookie-secret-change-before-production}
            - {name: WORKSPACE_COOKIE_SECURE, value: "false"}
            - {name: CHECKER_IMAGE, value: "ghcr.io/maintainer64/cms-labs-checker:latest"}
            - {name: SESSION_RECONCILE_INTERVAL_SECONDS, value: "3"}
            - name: JWT_SECRET_KEY_PUBLIC
              valueFrom: {secretKeyRef: {name: cms-demo-jwt, key: public.pem}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          readinessProbe:
            httpGet: {path: /clabgate/api/docs/index.html, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: clabgate
  namespace: cms-labs-system
spec:
  selector: {app: clabgate}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cms-labs-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/maintainer64/cms-labs-api/frontend:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: SYSTEM_DNS, value: "10.96.0.10"}
            - {name: CMS_CORE_SERVICE, value: "http://backend.cms-labs-system.svc.cluster.local:5000"}
            - {name: CLABGATE_SERVICE, value: "http://clabgate.cms-labs-system.svc.cluster.local:80"}
            - {name: SSL_CONF, value: ""}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cms-labs-system
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
